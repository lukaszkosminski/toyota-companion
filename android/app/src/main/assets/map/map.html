<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<link rel="stylesheet" href="leaflet.css">
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#1b1b1f}#map{width:100%;height:100%}</style>
</head>
<body>
<div id="map"></div>
<script src="leaflet.js"></script>
<script>
// The points arrive in the URL fragment: lat,lon,label;lat,lon,label (docs/SPEC.md §26). Already rounded by the app.
var mapEl = document.getElementById('map');
// A WebView inside a Compose layout may be laid out at zero height first; the pixel height follows the real window.
function fit() {
  mapEl.style.height = window.innerHeight + 'px';
  if (typeof map !== 'undefined') map.invalidateSize();
}
fit();
window.addEventListener('resize', fit);
[200, 800, 2000].forEach(function (ms) { setTimeout(fit, ms); });
var map = L.map(mapEl);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
var points = decodeURIComponent(location.hash.slice(1)).split(';').map(function (p) {
  var a = p.split(',');
  return { lat: parseFloat(a[0]), lon: parseFloat(a[1]), label: (a[2] || '').replace(/[<>&"]/g, '') };
}).filter(function (p) { return isFinite(p.lat) && isFinite(p.lon); });
var latlngs = points.map(function (p) { return [p.lat, p.lon]; });
points.forEach(function (p) {
  L.circleMarker([p.lat, p.lon], { radius: 9, color: '#ffffff', weight: 2, fillColor: '#3b6fd4', fillOpacity: 1 })
    .addTo(map).bindTooltip(p.label, { permanent: true, direction: 'top', offset: [0, -8] });
});
var straight = null;
if (latlngs.length > 1) {
  // Straight line between the two ends: the archive keeps no route (docs/SPEC.md §10.3).
  straight = L.polyline(latlngs, { color: '#3b6fd4', weight: 3, dashArray: '6 8', opacity: 0.8 }).addTo(map);
  map.fitBounds(latlngs, { padding: [48, 48], maxZoom: 16 });
} else if (latlngs.length === 1) {
  map.setView(latlngs[0], 16);
} else {
  map.setView([54.37, 18.63], 10);
}
// The app calls this with the drives of one repeated route: [{p: [[lat, lon], ...], f: 0..1, t: "4,3 l/100 km"}], f = share of the
// route's best (0, green) to worst (1, red) consumption (docs/SPEC.md §34).
function heatColor(f) {
  var a = f < 0.5 ? [46, 158, 91] : [240, 200, 60];
  var b = f < 0.5 ? [240, 200, 60] : [214, 60, 60];
  var k = f < 0.5 ? f * 2 : (f - 0.5) * 2;
  return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * k); }).join(',') + ')';
}
function showHeat(lines) {
  var all = [];
  if (straight) { map.removeLayer(straight); straight = null; }
  lines.forEach(function (line) {
    var pts = line.p.filter(function (p) { return isFinite(p[0]) && isFinite(p[1]); });
    if (pts.length < 2) return;
    all = all.concat(pts);
    L.polyline(pts, { color: heatColor(line.f), weight: 4, opacity: 0.65 }).addTo(map).bindTooltip(String(line.t).replace(/[<>&"]/g, ''), { sticky: true });
  });
  if (all.length) map.fitBounds(all, { padding: [48, 48], maxZoom: 17 });
}
// The app calls this with the GPS route: [[lat, lon, ev], ...], ev 1 = battery, 0 = engine, -1 = unknown (docs/SPEC.md §27).
function showRoute(route) {
  var pts = route.filter(function (p) { return isFinite(p[0]) && isFinite(p[1]); });
  if (pts.length < 2) return;
  if (straight) { map.removeLayer(straight); straight = null; }
  var all = [];
  var runStart = 0;
  function flush(end) {
    var seg = pts.slice(runStart, end + 1).map(function (p) { return [p[0], p[1]]; });
    all = all.concat(seg);
    if (seg.length > 1) {
      L.polyline(seg, { color: pts[runStart][2] === 1 ? '#2e9e5b' : '#3b6fd4', weight: 5, opacity: 0.9 }).addTo(map);
    }
  }
  for (var i = 1; i < pts.length; i++) {
    if (pts[i][2] !== pts[runStart][2]) { flush(i); runStart = i; }
  }
  flush(pts.length - 1);
  map.fitBounds(all, { padding: [48, 48], maxZoom: 17 });
}
</script>
</body>
</html>
