[project]
name = "toyota-companion-backend"
version = "0.1.0"
requires-python = ">=3.11"
# Wykonywalna specyfikacja domeny: tylko stdlib. Klient Toyoty i FastAPI
# zostały usunięte wraz z ADR-006 (backend nie jest już usługą).
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["app.domain"]
mypy_path = "."
