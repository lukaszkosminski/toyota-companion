name: Release

# Tag v<MAJOR>.<MINOR>.<PATCH> -> signed APK published as a GitHub Release; the app finds it in "Opcje"
# (docs/SPEC.md §37, ADR-016). The keystore lives only in the repository secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # SHA-256 of the release signing certificate (ADR-016, docs/SPEC.md §37); public, not a secret.
      RELEASE_CERT_SHA256: 4047aa035af2b9e7a3d4ccdfc325bcc8cd716cca5ca4132297ae2bd7478e7127
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token must not sit in .git/config while Gradle runs build plugins.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH (MINOR, PATCH up to 99)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Keystore from the secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Secret RELEASE_KEYSTORE_BASE64 is missing" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Tests and signed release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon -PappVersion=${{ steps.version.outputs.version }}
          :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Check the signature and the version
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "No signed APK (unsigned build?)" >&2; exit 1; }
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          "${build_tools}apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          head -n 3 "$RUNNER_TEMP/certs.txt"
          # Only the release key (ADR-016): a wrong keystore in the secrets would publish an APK the phone refuses.
          signers="$({ grep -o 'certificate SHA-256 digest: [0-9a-f]*' "$RUNNER_TEMP/certs.txt" || true; } | awk '{print $4}' | sort -u)"
          [ "$signers" = "$RELEASE_CERT_SHA256" ] \
            || { echo "APK is not signed only by the release key $RELEASE_CERT_SHA256" >&2; exit 1; }
          # The app compares the tag with the installed versionCode, so an APK with another version would never be offered.
          version="${{ steps.version.outputs.version }}"
          IFS=. read -r major minor patch <<< "$version"
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          # To a file, not "| head": with pipefail an early-closed pipe would fail the step.
          "${build_tools}aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -m 1 "^package:" "$RUNNER_TEMP/badging.txt"
          grep -q "^package: .* versionCode='$code' versionName='$version'" "$RUNNER_TEMP/badging.txt" \
            || { echo "APK version is not $version ($code)" >&2; exit 1; }
          cp "$apk" "$RUNNER_TEMP/toyota-companion-${{ steps.version.outputs.version }}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/toyota-companion-${{ steps.version.outputs.version }}.apk"
          --title "$GITHUB_REF_NAME" --generate-notes
